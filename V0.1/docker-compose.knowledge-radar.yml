version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledge-radar-postgres
    environment:
      POSTGRES_USER: kr_db
      POSTGRES_PASSWORD: kr_db_pass
      POSTGRES_DB: kr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kr_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: knowledge-radar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  knowledge-radar-api:
    build:
      context: apps/knowledge-radar-agent
      dockerfile: Dockerfile
    container_name: knowledge-radar-api
    command: uvicorn knowledge_radar.api.main:app --host 0.0.0.0 --port 8787 --reload
    ports:
      - "8787:8787"
    environment:
      DATABASE_URL: postgresql+asyncpg://kr_db:kr_db_pass@postgres:5432/kr_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/knowledge-radar-agent/src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  knowledge-radar-worker:
    build:
      context: apps/knowledge-radar-agent
      dockerfile: Dockerfile
    container_name: knowledge-radar-worker
    command: celery -A knowledge_radar.workers.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://kr_db:kr_db_pass@postgres:5432/kr_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/knowledge-radar-agent/src:/app/src

volumes:
  postgres_data:
  redis_data:
