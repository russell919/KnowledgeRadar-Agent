# Alembic Configuration for Knowledge Radar Agent

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# SQLite specific
# sqlcipher = yes

# PostgreSQL specific
# psycopg2 = yes

# PostgreSQL async specific
# asyncpg = yes

[post_write_hooks]
# post_write_hooks = noqa

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
