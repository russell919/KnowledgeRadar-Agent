name: faq_sop_promote
description: 判断知识是否可提升为FAQ或SOP
input_variables:
  - name: knowledge_items
    type: array
    description: 待评估的知识条目列表
  - name: existing_faqs
    type: array
    description: 现有的FAQ列表（用于避免重复）
    default: []
  - name: usage_patterns
    type: array
    description: 知识的使用模式（如被多次检索、多个用户关注）
    default: []
output_schema:
  type: object
  properties:
    promote_candidates:
      type: array
      description: 建议提升的知识条目
      items:
        type: object
        properties:
          knowledge_item:
            type: object
            description: 原知识条目
          promote_type:
            type: string
            enum: [faq, sop, both]
            description: 建议提升类型
          suggested_question:
            type: string
            description: 如果是FAQ，建议的问题形式
          suggested_title:
            type: string
            description: 建议的标题
          standard_answer:
            type: string
            description: 标准化的回答（如果是SOP）
          confidence:
            type: number
            minimum: 0
            maximum: 1
            description: 置信度
          source_refs:
            type: array
    not_promote_reasons:
      type: array
      description: 不建议提升的条目及原因
      items:
        type: object
        properties:
          knowledge_item:
            type: object
          reason:
            type: string
    source_ref:
      type: object
      description: 来源引用
    uncertainty:
      type: boolean
    uncertainty_reasons:
      type: array
      items:
        type: string
  required: [promote_candidates, source_ref]
system_prompt: |
  你是一个知识管理专家。你的任务是判断哪些知识可以提升为FAQ或SOP。

  FAQ 标准：
  - 被多次检索
  - 回答相对稳定，不会频繁变化
  - 有明确的答案

  SOP 标准：
  - 是流程性知识
  - 有明确的步骤
  - 可重复执行

  重要规则：
  1. 必须基于 usage_patterns 判断，不能凭空假设
  2. suggested_question 应以用户视角提问
  3. standard_answer 应结构化、易理解
  4. 必须与 existing_faqs 进行去重比较

  禁止事项：
  1. 禁止将不适合的知识强行提升为FAQ/SOP
  2. 禁止编造 usage_patterns 中不存在的信息
  3. 禁止在 source_refs 中添加不存在的引用

user_prompt_template: |
  请评估以下知识条目是否可提升为FAQ或SOP：

  待评估知识：
  {knowledge_items}

  现有FAQ：
  {existing_faqs}

  使用模式：
  {usage_patterns}

  请输出 JSON 格式的评估结果，包含 promote_candidates、not_promote_reasons（如有）、source_ref、uncertainty（如有）和 uncertainty_reasons（如有）。
