name: knowledge_event_extract
description: 从文档块、讨论单元、会议纪要、多维表格事实中抽取结构化知识
input_variables:
  - name: source_type
    type: string
    description: 来源类型 doc_block/chat_episode/meeting_note/bitable_record
  - name: source_ref
    type: object
    description: 来源引用，包含 source_id, source_type, title 等
  - name: content
    type: string
    description: 待抽取的内容
  - name: knowledge_types
    type: array
    description: 要抽取的知识类型列表
    default: [decision, action_item, risk, update, feedback, faq_candidate, reference]
output_schema:
  type: object
  properties:
    knowledge_items:
      type: array
      description: 抽取的知识条目列表
      items:
        type: object
        properties:
          knowledge_type:
            type: string
            enum: [decision, action_item, risk, update, feedback, faq_candidate, reference]
            description: 知识类型
          title:
            type: string
            description: 简短标题（不超过50字）
          summary:
            type: string
            description: 详细摘要（100-300字）
          key_points:
            type: array
            items:
              type: string
            description: 关键点列表（3-5条）
          source_refs:
            type: array
            description: 来源引用列表
            items:
              type: object
          confidence_score:
            type: number
            minimum: 0
            maximum: 1
            description: 置信度评分
          uncertainty:
            type: boolean
            description: 是否存在不确定的地方
          uncertainty_reason:
            type: string
            description: 不确定的原因
    source_ref:
      type: object
      description: 本次抽取的来源引用
    no_knowledge_found:
      type: boolean
      description: 是否未找到任何知识
  required: [knowledge_items, source_ref]
system_prompt: |
  你是一个知识抽取专家。你的任务是从给定的内容中抽取结构化的知识条目。

  知识类型定义：
  - decision: 决策内容，包括做出的选择、确定的方向、批准的方案等
  - action_item: 行动项，包括分配的任务、计划的活动、待执行的事项等
  - risk: 风险点，包括识别的问题、潜在的威胁、已知的限制等
  - update: 状态更新，包括进展报告、变更通知、进度汇报等
  - feedback: 反馈意见，包括评审意见、用户反馈、改进建议等
  - faq_candidate: FAQ候选，常见问题的标准回答
  - reference: 参考资料，包括引用的文档、数据来源、背景材料等

  重要规则：
  1. 每个 knowledge_item 必须有 source_refs，指向原始内容
  2. confidence_score 必须合理评估，过低（<0.3）的条目应标记 uncertainty
  3. 如果内容中确实没有某种知识类型，该类型可以不出现在输出中
  4. 如果对内容理解不确定，使用 uncertainty 和 uncertainty_reason 说明
  5. 允许"不确定"，可以返回空列表或低置信度条目

  禁止事项：
  1. 禁止编造内容中不存在的信息
  2. 禁止添加超出内容范围的 source_refs
  3. 禁止对模糊内容做强行推断（应降低 confidence_score 或标记 uncertainty）

user_prompt_template: |
  请从以下内容中抽取知识：

  来源类型：{source_type}
  来源引用：{source_ref}

  内容：
  {content}

  要抽取的知识类型：{knowledge_types}

  请输出 JSON 格式的知识条目列表，包含 knowledge_items、source_ref、no_knowledge_found。
