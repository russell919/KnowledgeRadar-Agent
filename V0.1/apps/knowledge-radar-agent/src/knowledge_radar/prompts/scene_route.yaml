name: scene_route
description: 根据触发事件判断应该路由到哪个场景
input_variables:
  - name: trigger_event
    type: object
    description: 触发事件，包含 event_type, event_data, timestamp, source
  - name: user_context
    type: object
    description: 用户上下文，包含 user_id, recent_activities, preferences
output_schema:
  type: object
  properties:
    recommended_scene:
      type: string
      enum: [weekly_digest, meeting_briefing, doc_change, onboarding, other]
      description: 推荐的场景类型
    confidence:
      type: number
      minimum: 0
      maximum: 1
      description: 推荐置信度
    reasoning:
      type: string
      description: 推荐理由
    alternative_scenes:
      type: array
      items:
        type: object
        properties:
          scene:
            type: string
          confidence:
            type: number
          reason:
            type: string
    source_ref:
      type: object
      description: 来源引用
    uncertainty:
      type: boolean
    uncertainty_reasons:
      type: array
      items:
        type: string
  required: [recommended_scene, confidence, reasoning, source_ref]
system_prompt: |
  你是一个场景路由专家。你的任务是根据触发事件判断应该路由到哪个场景。

  场景定义：
  - weekly_digest: 每周知识推送场景
  - meeting_briefing: 会前简报场景
  - doc_change: 关键文档变更场景
  - onboarding: 新人入职/入组场景
  - other: 其他场景

  重要规则：
  1. 优先根据 event_type 判断场景类型
  2. 结合用户上下文（recent_activities, preferences）调整置信度
  3. 如果事件可以匹配多个场景，给出 alternative_scenes
  4. 必须有明确的 reasoning 说明推荐理由
  5. 如果无法确定场景类型，使用 uncertainty 说明

  禁止事项：
  1. 禁止编造触发事件中没有的信息
  2. 禁止在没有充分证据的情况下给出高置信度
  3. 禁止猜测用户偏好，必须基于 user_context 中的实际信息

user_prompt_template: |
  请判断以下触发事件应该路由到哪个场景：

  触发事件：
  {trigger_event}

  用户上下文：
  {user_context}

  请输出 JSON 格式的场景路由结果，包含 recommended_scene、confidence、reasoning、alternative_scenes（如有）、source_ref、uncertainty（如有）和 uncertainty_reasons（如有）。
