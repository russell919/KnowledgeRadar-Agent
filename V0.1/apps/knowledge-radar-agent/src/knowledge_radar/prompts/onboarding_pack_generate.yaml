name: onboarding_pack_generate
description: 生成新人入组知识包
input_variables:
  - name: gaps
    type: array
    description: 知识差距分析结果
  - name: user_profile
    type: object
    description: 新人用户画像
  - name: group_context
    type: object
    description: 团队上下文
  - name: retrieved_knowledge
    type: array
    description: 检索到的相关知识
output_schema:
  type: object
  properties:
    card_title:
      type: string
      description: 卡片标题
    overview:
      type: object
      properties:
        project_summary:
          type: string
          description: 项目是什么
        current_phase:
          type: string
          description: 当前阶段
        team_introduction:
          type: string
          description: 团队介绍
    must_read_materials:
      type: array
      description: 必读材料
      items:
        type: object
        properties:
          title:
            type: string
          reason:
            type: string
          source_refs:
            type: array
          priority:
            type: string
    key_decisions:
      type: array
      description: 关键决策
      items:
        type: object
        properties:
          decision:
            type: string
          rationale:
            type: string
          source_refs:
            type: array
    open_items:
      type: array
      description: 未闭环事项
      items:
        type: object
        properties:
          item:
            type: string
          status:
            type: string
          owner:
            type: string
          source_refs:
            type: array
    risks:
      type: array
      description: 已知风险
      items:
        type: object
        properties:
          risk:
            type: string
          impact:
            type: string
          mitigation:
            type: string
          source_refs:
            type: array
    key_contacts:
      type: array
      description: 关键联系人
      items:
        type: object
        properties:
          name:
            type: string
          role:
            type: string
          responsibility:
            type: string
          reason:
            type: string
    first_week_suggestions:
      type: array
      description: 第一周建议事项
      items:
        type: object
        properties:
          suggestion:
            type: string
          reason:
            type: string
          evidence_refs:
            type: array
    questions_to_explore:
      type: array
      description: 可追问问题
      items:
        type: object
        properties:
          question:
            type: string
          reason:
            type: string
          evidence_refs:
            type: array
    source_refs:
      type: array
      description: 所有引用的来源
    uncertainty:
      type: boolean
    uncertainty_reasons:
      type: array
      items:
        type: string
  required: [card_title, overview, must_read_materials, source_refs]
system_prompt: |
  你是一个入职引导包生成专家。你的任务是为新人生成完整的入组知识包。

  重要规则：
  1. 必须基于 gaps 和 retrieved_knowledge，不得编造知识内容
  2. 所有内容必须有 source_refs
  3. first_week_suggestions 和 questions_to_explore 必须有 reason 和 evidence_refs
  4. key_contacts 应基于 group_context 中的 team_members
  5. 必须覆盖 gaps 中识别的高优先级差距

  禁止事项：
  1. 禁止编造不存在的项目或决策
  2. 禁止省略任何内容的 source_refs
  3. 禁止猜测 key_contacts 中不存在的人员
  4. 禁止生成没有证据支持的 suggestion 或 question

user_prompt_template: |
  请生成新人入组知识包：

  知识差距：
  {gaps}

  新人画像：
  {user_profile}

  团队上下文：
  {group_context}

  检索到的相关知识：
  {retrieved_knowledge}

  请输出 JSON 格式的知识包内容，包含 card_title、overview、must_read_materials、key_decisions、open_items、risks、key_contacts、first_week_suggestions、questions_to_explore、source_refs、uncertainty（如有）和 uncertainty_reasons（如有）。
