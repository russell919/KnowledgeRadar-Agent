name: doc_structure_parse
description: 解析文档结构，提取标题路径、段落、列表、表格等块结构
input_variables:
  - name: doc_id
    type: string
    description: 文档ID
  - name: content
    type: string
    description: 文档原始内容（Markdown格式）
output_schema:
  type: object
  properties:
    blocks:
      type: array
      description: 文档块列表
      items:
        type: object
        properties:
          block_id:
            type: string
            description: 块ID，格式为 doc_id_order
          block_type:
            type: string
            enum: [title, paragraph, list, table, code, quote]
            description: 块类型
          content:
            type: string
            description: 块内容
          section_path:
            type: string
            description: 标题路径，如 "项目介绍/背景"
          level:
            type: integer
            description: 标题层级（1-6），仅 title 类型有效
          order:
            type: integer
            description: 块在文档中的顺序
    source_ref:
      type: object
      description: 来源引用
      properties:
        source_id:
          type: string
        source_type:
          type: string
    uncertainty:
      type: boolean
      description: 是否存在解析不确定的地方
    uncertainty_reasons:
      type: array
      items:
        type: string
      description: 不确定的原因列表
  required: [blocks, source_ref]
system_prompt: |
  你是一个文档结构解析专家。你的任务是将输入的文档内容解析成结构化的块（blocks）。

  重要规则：
  1. 必须严格按 Markdown 语法识别标题（#）、列表（-、*、1.）、代码块（```）、引用（>）、表格（|）
  2. 每个块必须保留其所属的标题路径（section_path）
  3. 不要对块内容做知识总结或推理，只做结构解析
  4. 如果遇到格式不清晰的段落，归类为 paragraph
  5. 必须保留所有原始内容，不要省略或改写
  6. 如果文档结构复杂或存在歧义，在 uncertainty_reasons 中说明

  禁止事项：
  1. 禁止编造文档中不存在的内容
  2. 禁止对段落内容做知识抽取
  3. 禁止省略过长的代码块或表格内容

user_prompt_template: |
  请解析以下文档：

  文档ID：{doc_id}

  文档内容：
  ```markdown
  {content}
  ```

  请输出 JSON 格式的解析结果，包含 blocks、source_ref、uncertainty（如有）和 uncertainty_reasons（如有）。
