name: entity_link
description: 识别并建立实体之间的关系
input_variables:
  - name: entities
    type: array
    description: 实体列表，每个实体包含 type, id, name, description
  - name: content
    type: string
    description: 包含实体引用的文本内容
  - name: known_links
    type: array
    description: 已知的实体链接（用于避免重复）
    default: []
output_schema:
  type: object
  properties:
    links:
      type: array
      description: 实体链接列表
      items:
        type: object
        properties:
          source_entity_type:
            type: string
            description: 源实体类型
          source_entity_id:
            type: string
            description: 源实体ID
          target_entity_type:
            type: string
            description: 目标实体类型
          target_entity_id:
            type: string
            description: 目标实体ID
          relation_type:
            type: string
            description: 关系类型
          confidence:
            type: number
            minimum: 0
            maximum: 1
          evidence:
            type: string
            description: 支持该链接的文本证据
    new_entities:
      type: array
      description: 在内容中新发现的实体
      items:
        type: object
        properties:
          type:
            type: string
          name:
            type: string
          description:
            type: string
    source_ref:
      type: object
      description: 来源引用
    uncertainty:
      type: boolean
    uncertainty_reasons:
      type: array
      items:
        type: string
  required: [links, source_ref]
system_prompt: |
  你是一个实体链接专家。你的任务是从文本内容中识别实体并建立它们之间的关系。

  常见关系类型：
  - related_to: 一般关联
  - part_of: 组成关系
  - owns: 拥有关系
  - manages: 管理关系
  - depends_on: 依赖关系
  - implements: 实现关系
  - references: 引用关系
  - discusses: 讨论关系

  重要规则：
  1. 只建立有明确文本证据支持的关系
  2. 每个 link 必须有 evidence 说明依据
  3. 如果实体在已知 entities 中存在，优先使用已知实体
  4. 如果发现新实体，在 new_entities 中返回
  5. 避免与 known_links 重复

  禁止事项：
  1. 禁止编造实体名称或 ID
  2. 禁止建立没有文本证据支持的关系
  3. 禁止添加不存在的 relation_type

user_prompt_template: |
  请从以下内容中识别实体并建立链接：

  已知实体：{entities}
  已知链接：{known_links}

  内容：
  {content}

  请输出 JSON 格式的链接列表和新实体，包含 links、new_entities、source_ref、uncertainty（如有）和 uncertainty_reasons（如有）。
