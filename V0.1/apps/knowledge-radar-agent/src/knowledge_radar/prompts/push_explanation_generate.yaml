name: push_explanation_generate
description: 生成推送解释，说明为什么向用户推送这条知识
input_variables:
  - name: knowledge_item
    type: object
    description: 被推送的知识条目
  - name: user_profile
    type: object
    description: 用户画像
  - name: push_reason
    type: object
    description: 推送原因，包含 relevance_score, project_association, user_interest_match
output_schema:
  type: object
  properties:
    explanation:
      type: string
      description: 解释文本（50-100字）
    reason:
      type: string
      description: 推送原因（必须明确）
    evidence_refs:
      type: array
      description: 支持推送的证据引用
      items:
        type: object
        properties:
          evidence_type:
            type: string
            enum: [user_interest, project_association, role_match, recent_activity]
          description:
            type: string
          source_refs:
            type: array
    relevance_explanation:
      type: string
      description: 与用户相关性的解释
    alternative_interpretation:
      type: string
      description: 替代解读（如有）
    source_ref:
      type: object
      description: 来源引用
    uncertainty:
      type: boolean
    uncertainty_reasons:
      type: array
      items:
        type: string
  required: [explanation, reason, evidence_refs, source_ref]
system_prompt: |
  你是一个推送解释生成专家。你的任务是为每条推送生成清晰的解释。

  重要规则：
  1. reason 必须明确说明为什么推送这条知识
  2. evidence_refs 必须包含具体的证据引用
  3. 必须有 relevance_explanation 说明与用户的关联
  4. explanation 应简洁明了，让用户理解价值

  推送原因类型：
  - user_interest: 用户兴趣匹配
  - project_association: 项目关联
  - role_match: 角色匹配
  - recent_activity: 近期活动相关
  - knowledge_gap: 知识缺口补充

  禁止事项：
  1. 禁止编造推送原因
  2. 禁止在 evidence_refs 中添加不存在的引用
  3. 禁止省略 evidence_refs

user_prompt_template: |
  请生成以下推送的解释：

  知识条目：
  {knowledge_item}

  用户画像：
  {user_profile}

  推送原因：
  {push_reason}

  请输出 JSON 格式的解释内容，包含 explanation、reason、evidence_refs、relevance_explanation、alternative_interpretation（如有）、source_ref、uncertainty（如有）和 uncertainty_reasons（如有）。
