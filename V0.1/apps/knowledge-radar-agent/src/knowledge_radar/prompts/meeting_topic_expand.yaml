name: meeting_topic_expand
description: 根据会议标题、描述、参会人等推断会议目标，解决会议标题很短的问题
input_variables:
  - name: meeting_basic_info
    type: object
    description: 会议基本信息，包含 meeting_id, title, description, participants, attachments, calendar_event_id
  - name: recent_project_events
    type: array
    description: 近期项目事件列表
    default: []
  - name: known_context
    type: object
    description: 已知的上下文信息
    default: {}
output_schema:
  type: object
  properties:
    expanded_topic:
      type: string
      description: 扩展后的会议主题（完整描述）
    meeting_objective:
      type: string
      description: 会议目标
    project_candidates:
      type: array
      items:
        type: string
      description: 可能相关的项目ID列表
    retrieval_keywords:
      type: array
      items:
        type: string
      description: 用于检索相关知识的关键词
    required_knowledge_types:
      type: array
      items:
        type: string
        enum: [decision, action_item, risk, update, feedback, faq_candidate, reference]
      description: 需要检索的知识类型
    pre_meeting_questions:
      type: array
      items:
        type: string
      description: 会前需要确认的问题
    evidence_refs:
      type: array
      description: 支持推断的证据引用
    source_ref:
      type: object
      description: 来源引用
    uncertainty:
      type: boolean
    uncertainty_reasons:
      type: array
      items:
        type: string
  required: [expanded_topic, meeting_objective, source_ref]
system_prompt: |
  你是一个会议分析专家。你的任务是根据有限的会议信息推断会议的真实目标。

  重要规则：
  1. 标题很短时，必须结合 description、participants、attachments、recent_project_events 推断
  2. project_candidates 应基于参会人和近期项目事件推断
  3. retrieval_keywords 应能有效检索到与会议相关的知识
  4. required_knowledge_types 应覆盖会议可能涉及的知识类型
  5. 如果信息不足，使用 uncertainty 说明，不要强行推断

  禁止事项：
  1. 禁止编造会议中不存在的信息
  2. 禁止基于猜测而非证据给出 project_candidates
  3. 禁止在 evidence_refs 中添加没有实际引用的来源

user_prompt_template: |
  请推断以下会议的完整主题和目标：

  会议基本信息：
  {meeting_basic_info}

  近期项目事件：
  {recent_project_events}

  已知上下文：
  {known_context}

  请输出 JSON 格式的推断结果，包含 expanded_topic、meeting_objective、project_candidates、retrieval_keywords、required_knowledge_types、pre_meeting_questions、evidence_refs、source_ref、uncertainty（如有）和 uncertainty_reasons（如有）。
