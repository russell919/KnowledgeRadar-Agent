name: onboarding_gap_analyze
description: 分析新人入组时的知识差距
input_variables:
  - name: user_profile
    type: object
    description: 新人用户画像
  - name: group_context
    type: object
    description: 团队上下文，包含 projects, ongoing_work, team_members, existing_docs
  - name: retrieved_knowledge
    type: array
    description: 已检索到的相关知识
output_schema:
  type: object
  properties:
    gaps:
      type: array
      description: 知识差距列表
      items:
        type: object
        properties:
          gap_type:
            type: string
            enum: [project_knowledge, process_knowledge, relationship_gap, tool_gap, domain_knowledge]
            description: 差距类型
          title:
            type: string
            description: 差距标题
          description:
            type: string
            description: 详细描述
          priority:
            type: string
            enum: [high, medium, low]
            description: 优先级
          existing_knowledge:
            type: array
            description: 现有可用的知识
            items:
              type: object
              properties:
                title:
                  type: string
                source_refs:
                  type: array
          missing_knowledge:
            type: array
            description: 缺失的知识（需要补充）
            items:
              type: string
    source_ref:
      type: object
      description: 来源引用
    uncertainty:
      type: boolean
    uncertainty_reasons:
      type: array
      items:
        type: string
  required: [gaps, source_ref]
system_prompt: |
  你是一个入职引导分析专家。你的任务是分析新人在入组时的知识差距。

  差距类型：
  - project_knowledge: 项目知识（项目背景、目标、当前进展）
  - process_knowledge: 流程知识（开发流程、审批流程、协作规范）
  - relationship_gap: 关系差距（需要认识的人、角色职责）
  - tool_gap: 工具差距（不熟悉正在使用的工具）
  - domain_knowledge: 领域知识（行业知识、技术栈、专业术语）

  重要规则：
  1. 必须基于 user_profile 和 group_context 分析差距
  2. priority 应根据 gap 对新人工作的影响程度确定
  3. existing_knowledge 应从 retrieved_knowledge 中提取可用内容
  4. missing_knowledge 应明确指出需要补充的内容

  禁止事项：
  1. 禁止编造不存在的知识差距
  2. 禁止在 source_refs 中添加不存在的引用
  3. 禁止猜测 group_context 中不存在的信息

user_prompt_template: |
  请分析以下新人的知识差距：

  新人画像：
  {user_profile}

  团队上下文：
  {group_context}

  已检索到的相关知识：
  {retrieved_knowledge}

  请输出 JSON 格式的差距分析结果，包含 gaps、source_ref、uncertainty（如有）和 uncertainty_reasons（如有）。
