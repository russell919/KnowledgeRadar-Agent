name: meeting_briefing_generate
description: 生成会前30分钟简报
input_variables:
  - name: meeting_info
    type: object
    description: 会议信息，包含 expanded_topic, meeting_objective, participants
  - name: retrieved_knowledge
    type: array
    description: 检索到的相关知识
  - name: action_items
    type: array
    description: 与会议相关的行动项
  - name: user_profile
    type: object
    description: 用户画像
output_schema:
  type: object
  properties:
    card_title:
      type: string
      description: 卡片标题
    meeting_summary:
      type: object
      properties:
        objective:
          type: string
          description: 会议目标
        duration:
          type: string
          description: 预计时长
        participants:
          type: array
          items:
            type: string
        your_role:
          type: string
          description: 用户在会议中的角色
    relevant_background:
      type: array
      description: 相关背景知识
      items:
        type: object
        properties:
          title:
            type: string
          summary:
            type: string
          source_refs:
            type: array
    discussion_points:
      type: array
      items:
        type: object
        properties:
          point:
            type: string
          context:
            type: string
          source_refs:
            type: array
    open_action_items:
      type: array
      items:
        type: object
        properties:
          title:
            type: string
          owner:
            type: string
          status:
            type: string
          source_refs:
            type: array
    questions_to_ask:
      type: array
      items:
        type: object
        properties:
          question:
            type: string
          reason:
            type: string
          evidence_refs:
            type: array
    source_refs:
      type: array
      description: 所有引用的来源
    uncertainty:
      type: boolean
    uncertainty_reasons:
      type: array
      items:
        type: string
  required: [card_title, meeting_summary, relevant_background, discussion_points, source_refs]
system_prompt: |
  你是一个会前简报生成专家。你的任务是为用户生成会前30分钟简报。

  重要规则：
  1. 简报必须基于 retrieved_knowledge 和 action_items，不得编造
  2. discussion_points 应涵盖会议可能讨论的主题
  3. questions_to_ask 必须有 reason 和 evidence_refs
  4. 所有内容必须有对应的 source_refs
  5. 根据 user_profile 调整内容的相关性和优先级

  禁止事项：
  1. 禁止编造会议中没有的信息
  2. 禁止省略任何内容的 source_refs
  3. 禁止生成没有证据支持的 questions_to_ask
  4. 禁止猜测用户在会议中的角色，必须基于实际信息

user_prompt_template: |
  请生成会前30分钟简报：

  会议信息：
  {meeting_info}

  检索到的相关知识：
  {retrieved_knowledge}

  行动项：
  {action_items}

  用户画像：
  {user_profile}

  请输出 JSON 格式的简报内容，包含 card_title、meeting_summary、relevant_background、discussion_points、open_action_items、questions_to_ask、source_refs、uncertainty（如有）和 uncertainty_reasons（如有）。
