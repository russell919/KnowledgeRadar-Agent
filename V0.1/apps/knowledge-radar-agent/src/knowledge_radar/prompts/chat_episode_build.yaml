name: chat_episode_build
description: 将聊天消息重建为会话片段，按reply/thread、时间窗口、共同实体、参与人划分
input_variables:
  - name: chat_id
    type: string
    description: 聊天会话ID
  - name: messages
    type: array
    description: 消息列表，每个消息包含 message_id, sender_id, content, created_at, reply_to（可选）
  - name: time_window_minutes
    type: integer
    description: 时间窗口分钟数，用于判断是否属于同一会话
    default: 30
  - name: known_entities
    type: array
    description: 已知的实体列表，用于关联分析
    default: []
output_schema:
  type: object
  properties:
    episodes:
      type: array
      description: 会话片段列表
      items:
        type: object
        properties:
          episode_id:
            type: string
            description: 会话片段ID
          messages:
            type: array
            description: 该片段包含的消息
            items:
              type: object
              properties:
                message_id:
                  type: string
                sender_id:
                  type: string
                content:
                  type: string
                created_at:
                  type: string
          participants:
            type: array
            items:
              type: string
            description: 参与人ID列表
          start_time:
            type: string
            description: 片段开始时间
          end_time:
            type: string
            description: 片段结束时间
          topic:
            type: string
            description: 片段主题（从消息内容推断，不要过度解读）
          entities:
            type: array
            items:
              type: string
            description: 片段中提到的实体
    source_ref:
      type: object
      description: 来源引用
    uncertainty:
      type: boolean
    uncertainty_reasons:
      type: array
      items:
        type: string
  required: [episodes, source_ref]
system_prompt: |
  你是一个会话分析专家。你的任务是将聊天消息重建为有意义的会话片段（episodes）。

  重要规则：
  1. 优先按 reply/thread 关系划分，同一 thread 的消息应在同一 episode
  2. 其次按时间窗口划分，间隔超过 time_window_minutes 的消息应分属不同 episode
  3. 检查共同实体，提到相同项目的消息可考虑归为同一 episode
  4. 检查共同参与人，同时参与同一讨论的用户应考虑归为同一 episode
  5. 不要对单条消息做知识结论（如"决定"、"风险"等），只做会话结构解析
  6. topic 应从消息内容中提取，不要过度推断
  7. 如果消息内容不完整或格式混乱，使用 uncertainty_reasons 说明

  禁止事项：
  1. 禁止编造消息内容
  2. 禁止对消息做知识抽取（如从中提取决策、风险等）
  3. 禁止将不相关的时间接近的消息强行合并

user_prompt_template: |
  请重建以下聊天会话的片段：

  聊天ID：{chat_id}
  时间窗口：{time_window_minutes} 分钟
  已知实体：{known_entities}

  消息列表：
  {messages}

  请输出 JSON 格式的会话片段，包含 episodes、source_ref、uncertainty（如有）和 uncertainty_reasons（如有）。
